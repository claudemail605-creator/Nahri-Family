<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#d95d39">
  <title data-i18n>brand.title</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Installable web app (Phase 6): manifest + icons, so relatives can add the
       tree to their phone's home screen. -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Family Tree">
  <!-- Fonts for Urdu and Hindi are loaded only when that language is chosen
       (see loadFonts() in js/i18n.js); the preconnects just warm the connection. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn only-mobile" id="btnFilters" data-i18n="btnFilters" data-i18n-attr="aria-label">☰</button>
    <div class="brand">
      <span class="brand-mark">⌂</span>
      <div>
        <h1 data-i18n>brand.title</h1>
        <p id="subtitle">Loading…</p>
      </div>
    </div>

    <div class="search">
      <span class="search-ico">⌕</span>
      <input id="search" type="search" data-i18n-placeholder="search.placeholder" placeholder="Search name, nickname, spouse, place…" autocomplete="off">
    </div>

    <div class="seg" id="viewSwitch" role="tablist">
      <button class="on" data-view="tree" role="tab" data-i18n>view.tree</button>
      <button data-view="table" role="tab" data-i18n>view.table</button>
    </div>

    <!-- My Family Branch: editors with an assigned branch (and admins, who can open
         any of them). The workspace explains each invitation. js/branch.js shows it. -->
    <button class="btn nav-branch" id="btnBranch" hidden>
      <span data-i18n>branch.nav</span>
    </button>
    <!-- Admins only: the spreadsheet export sits in the top bar. Importing an .xlsx is
         in the admin screen (Admin → Import and backup). -->
    <button class="btn ghost" id="btnExport" title="Export to Excel" data-i18n="export.title" data-i18n-attr="title" hidden>
      <span data-i18n>export.button</span>
    </button>
    <div class="auth" id="authArea"></div>
    <!-- Phase 6 tools: how are we related, upcoming dates, statistics, print / PNG. -->
    <button class="icon-btn" id="btnTools" title="Tools" data-i18n="extra.tools" data-i18n-attr="title" aria-label="Tools">🧰</button>
    <button class="icon-btn" id="btnRefresh" title="Refresh data" data-i18n="refresh.title" data-i18n-attr="title" aria-label="Refresh data">⟳</button>
    <button class="icon-btn" id="btnAdmin" data-i18n="btnAdmin" data-i18n-attr="aria-label" title="Admin panel" hidden>⚙</button>
    <div class="lang" id="langArea">
      <button class="icon-btn" id="btnLang" data-i18n="btnLang" data-i18n-attr="aria-label" title="Change language">🌐</button>
    </div>
    <button class="icon-btn" id="btnTheme" data-i18n="btnTheme" data-i18n-attr="aria-label" title="Toggle dark mode">☾</button>
  </header>

  <!-- Full-screen sign-in gate (Phase 1). Everything below stays hidden until an
       active user is signed in. -->
  <div id="authGate" class="auth-gate" hidden></div>

  <!-- Tap the shaded area outside the drawer to close it (mobile). -->
  <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <button class="icon-btn drawer-close only-mobile" id="btnDrawerClose" data-i18n="panel.close" data-i18n-attr="aria-label" aria-label="Close filters">✕</button>
      <!-- Phones: the top-bar "My branch" is hidden at this width, so the workspace
           keeps a permanent entry point at the top of the filter drawer. -->
      <button class="btn nav-branch-mobile" id="btnBranchMobile" hidden>
        <span data-i18n>branch.nav</span>
      </button>
      <div class="side-head">
        <h2 data-i18n>sidebar.filters</h2>
        <button class="link" id="btnReset" data-i18n>btnReset</button>
      </div>

      <div class="stats" id="stats"></div>

      <div class="field">
        <label data-i18n>label.generation</label>
        <div class="chips" id="genChips"></div>
      </div>

      <div class="field">
        <label data-i18n>label.gender</label>
        <div class="chips" id="genderChips"></div>
      </div>

      <div class="field">
        <label for="fStatus" data-i18n>label.status</label>
        <select id="fStatus">
          <option value="" data-i18n>status.everyone</option>
          <option value="living" data-i18n>status.living</option>
          <option value="deceased" data-i18n>status.deceased</option>
        </select>
      </div>

      <div class="field">
        <label for="fBranch" data-i18n>label.branch</label>
        <select id="fBranch"></select>
      </div>

      <div class="field">
        <label for="fPob" data-i18n>label.pob</label>
        <select id="fPob"></select>
      </div>

      <div class="field">
        <label for="fQual" data-i18n>label.qual</label>
        <select id="fQual"></select>
      </div>

      <div class="field">
        <label for="fHas" data-i18n>label.has</label>
        <select id="fHas">
          <option value="" data-i18n>has.anything</option>
          <option value="dob" data-i18n>has.dob</option>
          <option value="spouse" data-i18n>has.spouse</option>
          <option value="children" data-i18n>has.children</option>
          <option value="nochildren" data-i18n>has.nochildren</option>
        </select>
      </div>

      <!-- Phase 2: only admins see soft-deleted people, and only when they ask for them. -->
      <div class="field" id="deletedField" hidden>
        <label data-i18n>label.deleted</label>
        <label class="check-row">
          <input type="checkbox" id="showDeleted">
          <span data-i18n>filter.showDeleted</span>
        </label>
      </div>

      <div class="result-count" id="resultCount"></div>
    </aside>

    <main class="main">
      <section id="treeView" class="stage" aria-label="Family tree">
        <!-- Title + date for Print / Save as PDF (visible only when printing). -->
        <div class="print-head" id="printHead"></div>
        <div id="world" class="world"></div>
        <div class="stage-ctrls">
          <button class="icon-btn" id="zoomIn" title="Zoom in" data-i18n="zoom.in" data-i18n-attr="title">+</button>
          <button class="icon-btn" id="zoomOut" title="Zoom out" data-i18n="zoom.out" data-i18n-attr="title">−</button>
          <button class="icon-btn" id="zoomFit" title="Fit to screen" data-i18n="zoom.fit" data-i18n-attr="title">⤢</button>
          <button class="icon-btn" id="expandAll" title="Expand all" data-i18n="expand.all" data-i18n-attr="title">⊞</button>
          <button class="icon-btn" id="collapseAll" title="Collapse all" data-i18n="collapse.all" data-i18n-attr="title">⊟</button>
        </div>
        <div class="legend">
          <span><i class="dot male"></i> <span data-i18n>legend.male</span></span>
          <span><i class="dot female"></i> <span data-i18n>legend.female</span></span>
          <span><b>†</b> <span data-i18n>legend.deceased</span></span>
          <span class="hint" data-i18n>legend.hint</span>
        </div>
        <div class="empty" id="emptyMsg" hidden>
        <span data-i18n>empty.msg</span>
        <button type="button" class="link" id="btnClearFilters" data-i18n>empty.clear</button>
      </div>
      </section>

      <section id="tableView" class="table-wrap" hidden>
        <table id="table"></table>
      </section>

      <!-- My Family Branch — the guided workspace invited editors land on
           (js/branch.js). A dedicated screen, not a filtered copy of the tree. -->
      <section id="branchView" class="branch-view" hidden></section>
    </main>

    <aside class="panel" id="panel" aria-live="polite" hidden></aside>
  </div>

  <div class="tooltip" id="tooltip" hidden></div>
  <div class="toast" id="toast" hidden></div>

  <!-- Supabase (pinned 2.x UMD). Used only when a user signs in. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.min.js"></script>
  <!-- Excel reader/writer, used only by the admin screen ("Import from Excel" and
       "Export to Excel"). The tree itself is read from Supabase, never from a bundled
       spreadsheet. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/photos.js"></script>
  <script src="js/personform.js"></script>
  <script src="js/hijri.js"></script>
  <script src="js/healthcheck.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/extras.js"></script>
  <script src="js/app.js"></script>
  <script src="js/branch.js"></script>
</body>
</html>
