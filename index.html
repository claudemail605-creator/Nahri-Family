<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Nahri Family — a private family history archive. Sign in to explore the family tree, photos and records."
    />
    <title>Nahri Family</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..600&family=Public+Sans:ital,wght@0,300..700;1,300..600&display=swap"
    />
    <script>
      // Resolve the theme before first paint so there is no flash of the wrong
      // palette. Same rule as src/ui/theme.ts: an explicit saved choice wins,
      // otherwise follow the operating system.
      (function () {
        try {
          var saved = localStorage.getItem('nahri.theme');
          var theme =
            saved === 'dark' || saved === 'light'
              ? saved
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          /* storage or matchMedia unavailable — the default light palette applies */
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <p style="font-family: sans-serif; padding: 2rem; text-align: center">
        Nahri Family needs JavaScript enabled to display the family tree.
      </p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
